name: Happy Headlines CI/CD

on:
  push:
    branches: [main, master, Josephine]
  pull_request:
    branches: [main, master, Josephine]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Restore, Release build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAPPY_HEADLINES_ROOT: ${{ github.workspace }}/HappyHeadlines
    defaults:
      run:
        working-directory: HappyHeadlines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore HappyHeadlines.sln
      - name: Release build
        run: dotnet build HappyHeadlines.sln --configuration Release --no-restore
      - name: Tests
        run: dotnet test HappyHeadlines.sln --configuration Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: HappyHeadlines/TestResults/*.trx
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [ArticleService, CommentService, ProfanityService, DraftService, PublisherService, NewsletterService]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: printf 'tag=happy-headlines/%s:build\n' "${SERVICE,,}" >> "$GITHUB_OUTPUT"
      - name: Build image archive
        uses: docker/build-push-action@v6
        with:
          context: HappyHeadlines
          file: HappyHeadlines/src/${{ matrix.service }}/Dockerfile
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.service }}.tar
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            org.opencontainers.image.version=${{ github.ref_name }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Save image for publication
        if: github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/Josephine"]'), github.ref)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish ${{ matrix.service }}
    needs: build
    if: github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/master","refs/heads/Josephine"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ArticleService, CommentService, ProfanityService, DraftService, PublisherService, NewsletterService]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push verified image
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/image/${{ matrix.service }}.tar
        run: |
          branch="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')"
          version="${branch}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          image="ghcr.io/${REPOSITORY,,}/happy-headlines-${SERVICE,,}:${version}"
          docker load --input "$IMAGE_ARCHIVE"
          docker tag "happy-headlines/${SERVICE,,}:build" "$image"
          docker push "$image"
          printf '### %s\n\n%s\n' "$SERVICE" "$image" >> "$GITHUB_STEP_SUMMARY"