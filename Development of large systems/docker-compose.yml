services:
  article-service-1:
    image: happyheadlines-article
    build: .
    environment:
      INSTANCE_NAME: article-service-1
      RabbitMq__Host: rabbitmq
      SeqUrl: http://seq:5341
    volumes:
      - article-data-csharp:/app/article-data

  article-service-2:
    image: happyheadlines-article
    environment:
      INSTANCE_NAME: article-service-2
      RabbitMq__Host: rabbitmq
      SeqUrl: http://seq:5341
    volumes:
      - article-data-csharp:/app/article-data

  article-service-3:
    image: happyheadlines-article
    environment:
      INSTANCE_NAME: article-service-3
      RabbitMq__Host: rabbitmq
      SeqUrl: http://seq:5341
    volumes:
      - article-data-csharp:/app/article-data

  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:5341:5341"
    volumes:
      - seq-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    hostname: happyheadlines-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: schoolproject
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  article-data-csharp:
  seq-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data: