services:
  article-service-1:
    image: happyheadlines-article
    build: .
    environment:
      INSTANCE_NAME: article-service-1
      RabbitMq__Host: rabbitmq
      SeqUrl: http://seq:5341
    volumes:
      - article-data-csharp:/app/article-data

  article-service-2:
    image: happyheadlines-article
    environment:
      INSTANCE_NAME: article-service-2
      RabbitMq__Host: rabbitmq
      SeqUrl: http://seq:5341
    volumes:
      - article-data-csharp:/app/article-data

  article-service-3:
    image: happyheadlines-article
    environment:
      INSTANCE_NAME: article-service-3
      RabbitMq__Host: rabbitmq
      SeqUrl: http://seq:5341
    volumes:
      - article-data-csharp:/app/article-data

  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:5341:5341"
    volumes:
      - seq-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    hostname: happyheadlines-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: schoolproject
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Password123!"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  article-data-csharp:
  seq-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  sqlserver-data: