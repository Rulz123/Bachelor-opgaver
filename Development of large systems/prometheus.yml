global:
  scrape_interval: 5s

scrape_configs:
  - job_name: article-cache
    static_configs:
      - targets:
          - article-service-1:8000
          - article-service-2:8000
          - article-service-3:8000

  - job_name: comment-cache
    static_configs:
      - targets:
          - host.docker.internal:5056