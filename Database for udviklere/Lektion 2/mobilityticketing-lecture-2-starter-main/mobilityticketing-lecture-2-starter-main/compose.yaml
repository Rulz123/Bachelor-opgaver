services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres/init/001_relational_baseline.sql:/docker-entrypoint-initdb.d/001_relational_baseline.sql:ro
      - ./database/postgres/init/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./database/postgres/init/010_ticketing_draftOriginal.sql:/docker-entrypoint-initdb.d/010_ticketing_draft.sql:ro
      - ./database/postgres/init/011_ticketing_seed.sql:/docker-entrypoint-initdb.d/011_ticketing_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility -d mobility"]
      interval: 2s
      timeout: 3s
      retries: 15
