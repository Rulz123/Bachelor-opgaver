events {}
http {
    upstream article_service {
        server article-service-1:8000;
        server article-service-2:8000;
        server article-service-3:8000;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://article_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
